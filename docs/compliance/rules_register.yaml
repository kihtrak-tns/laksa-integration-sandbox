  "rules": [
    {
      "id": "0.1.1",
      "category": "ip",
      "statement": "Do not use Caterpillar proprietary IP on the vehicle.",
      "severity": "blocking",
      "verification": "OPEN_EVIDENCE",
      "applies_to": ["source", "data", "dependencies", "documentation"],
      "evidence": ["signed source/data/dependency audit"]
    },
    {
      "id": "0.1.2",
      "category": "repository",
      "statement": "Use an external public code repository rather than internal GitHub Enterprise or gitgis.",
      "severity": "blocking",
      "verification": "ALIGNED",
      "applies_to": ["repository", "release"],
      "evidence": ["public official repository URL", "competition release commit/tag"]
    },
    {
      "id": "0.1.3-0.1.5",
      "category": "ip",
      "statement": "Follow organizer/IP processes for possible Caterpillar use or genuinely novel content.",
      "severity": "advisory",
      "verification": "PROCESS",
      "applies_to": ["architecture", "algorithms", "documentation"],
      "evidence": ["IP review record when applicable"]
    },
    {
      "id": "0.2.1",
      "category": "team",
      "statement": "Maintain at least two Cat Technology or Cat Digital employees on the team.",
      "severity": "blocking",
      "verification": "PROCESS",
      "applies_to": ["team"],
      "evidence": ["eligible roster"]
    },
    {
      "id": "0.2.2-0.2.3",
      "category": "funding",
      "statement": "Meet design-review and parts-list obligations when Caterpillar funding is used.",
      "severity": "blocking",
      "verification": "PROCESS",
      "applies_to": ["budget", "procurement"],
      "evidence": ["design-review record", "submitted parts list"]
    },
    {
      "id": "0.2.4-0.2.4.1",
      "category": "milestone",
      "statement": "By August 14, 2026 demonstrate forward motion, a controlled 90-degree turn, and forward motion afterward.",
      "severity": "blocking",
      "verification": "OPEN_DESIGN",
      "applies_to": ["autonomy", "control", "demo"],
      "evidence": ["video", "time-synchronized command/state/fault logs"]
    },
    {
      "id": "0.2.5-0.2.5.3",
      "category": "safety_review",
      "statement": "Complete the mandatory safety review including stop assertion, clearing, and heartbeat timeout with in-person representatives.",
      "severity": "blocking",
      "verification": "CLARIFY",
      "applies_to": ["safety", "schedule", "watchdog"],
      "evidence": ["safety-review signoff", "fault-injection logs"],
      "clarifications": ["CLAR-001", "CLAR-002"]
    },
    {
      "id": "0.3.1-0.3.2",
      "category": "dimensions",
      "statement": "Use US customary dimensions as controlling and account for nominal course variation of plus or minus one inch unless specified otherwise.",
      "severity": "blocking",
      "verification": "ALIGNED",
      "applies_to": ["mechanical", "planning"],
      "evidence": ["margin analysis"]
    },
    {
      "id": "1.1-1.1.2",
      "category": "safety",
      "statement": "The robot must not endanger people or robots and may be stopped/reinspected by staff.",
      "severity": "blocking",
      "verification": "OPEN_EVIDENCE",
      "applies_to": ["all"],
      "evidence": ["hazard analysis", "inspection checklist", "guards and restraints evidence"]
    },
    {
      "id": "1.2-1.2.2.4",
      "category": "estop",
      "statement": "Provide the mandatory RJ45 course stop interface: pins 1-4 common, pins 5-8 common, connected for RUN and isolated for STOP.",
      "severity": "blocking",
      "verification": "OPEN_DESIGN",
      "applies_to": ["electrical", "teensy", "safety"],
      "evidence": ["schematic", "pinout", "continuity/isolation tests", "disconnect/open-wire tests"],
      "clarifications": ["CLAR-009"]
    },
    {
      "id": "1.2.3",
      "category": "estop",
      "statement": "A team-provided auxiliary E-stop is optional and does not replace the course interface.",
      "severity": "advisory",
      "verification": "OPTIONAL",
      "applies_to": ["wireless_estop"],
      "evidence": ["scope decision"]
    },
    {
      "id": "1.2.4-1.2.7.2",
      "category": "auxiliary_estop",
      "statement": "If used, the auxiliary E-stop must be wireless, noninterfering, fail safe, and stop within one second on loss or request; 300 ft is recommended.",
      "severity": "blocking",
      "verification": "OPTIONAL",
      "applies_to": ["wireless_estop"],
      "evidence": ["range test", "interference test", "loss-of-link test", "stop-latency test"]
    },
    {
      "id": "1.2.8",
      "category": "operations",
      "statement": "Event staff and team members may operate E-stop activation devices around the course.",
      "severity": "advisory",
      "verification": "PROCESS",
      "applies_to": ["runbook"],
      "evidence": ["operator assignment and training"]
    },
    {
      "id": "1.2.9",
      "category": "estop",
      "statement": "E-stop must cease propulsion; Ackermann steering may continue only to prevent collision until fully stopped.",
      "severity": "blocking",
      "verification": "OPEN_DESIGN",
      "applies_to": ["teensy", "actuation", "control"],
      "evidence": ["stop-latency and distance logs", "bounded-steering test"]
    },
    {
      "id": "1.2.10",
      "category": "estop",
      "statement": "Automatic resume after E-stop clear is permitted when the design supports safe resumption.",
      "severity": "blocking",
      "verification": "OPEN_DESIGN",
      "applies_to": ["state_machine", "mission"],
      "evidence": ["guarded-resume requirements and tests"],
      "clarifications": ["CLAR-006"]
    },
    {
      "id": "1.3",
      "category": "operations",
      "statement": "Humans may enter only after all robots are E-stopped and completely stopped.",
      "severity": "blocking",
      "verification": "PROCESS",
      "applies_to": ["runbook"],
      "evidence": ["intervention procedure and rehearsal"]
    },
    {
      "id": "2.1.1-2.1.3",
      "category": "budget",
      "statement": "Caterpillar funding is capped at $1,000; the provided perception sensor is excluded; personal funds beyond the cap are allowed.",
      "severity": "blocking",
      "verification": "OPEN_EVIDENCE",
      "applies_to": ["bom", "procurement"],
      "evidence": ["component ledger with payer/source"],
      "clarifications": ["CLAR-008"]
    },
    {
      "id": "2.2.1",
      "category": "dimensions",
      "statement": "The robot may never exceed 16 inches wide, 24 inches long, or 16 inches high.",
      "severity": "blocking",
      "verification": "OPEN_EVIDENCE",
      "applies_to": ["mechanical", "sensors", "mounts"],
      "evidence": ["signed measurements and photos in complete race configuration"],
      "clarifications": ["CLAR-010"]
    },
    {
      "id": "2.2.2",
      "category": "weight",
      "statement": "The robot may not exceed 25 pounds.",
      "severity": "blocking",
      "verification": "OPEN_EVIDENCE",
      "applies_to": ["mechanical", "bom"],
      "evidence": ["race-ready weight record"]
    },
    {
