      "verification": "CONFLICT",
      "applies_to": ["rc", "xbox", "wifi", "bluetooth", "dashboard", "telemetry"],
      "evidence": ["competition-mode rejection test", "radio/configuration record"],
      "clarifications": ["CLAR-003"]
    },
    {
      "id": "2.5",
      "category": "autonomy",
      "statement": "The robot must start and stop autonomously.",
      "severity": "blocking",
      "verification": "OPEN_DESIGN",
      "applies_to": ["mission", "state_machine"],
      "evidence": ["end-to-end start/stop tests"]
    },
