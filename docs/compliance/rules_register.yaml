    {
      "id": "2.6-2.6.10",
      "category": "flag",
      "statement": "Carry the issued flag with its top 24-26 inches above ground and mount point no higher than 8 inches; only the flag/wire is exempt from envelope and weight.",
      "severity": "blocking",
      "verification": "OPEN_DESIGN",
      "applies_to": ["mechanical"],
      "evidence": ["mount design", "height and exemption measurements"],
      "clarifications": ["CLAR-010"]
