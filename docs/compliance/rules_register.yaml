      "severity": "blocking",
      "verification": "ALIGNED",
      "applies_to": ["battery", "power_distribution"],
      "evidence": ["maximum charged voltage and rail record", "protection schematic"]
    },
    {
      "id": "2.4-2.4.1",
      "category": "communications",
